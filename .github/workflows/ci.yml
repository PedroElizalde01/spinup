name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  # Lets the release workflow reuse this as its gate.
  workflow_call:

# Read-only by default; nothing here publishes.
permissions:
  contents: read

env:
  BUN_VERSION: "1.3.9"

jobs:
  check:
    name: Typecheck, test, audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The tmux workspace tests drive a real server on a private TMUX_TMPDIR.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      # Both YAML parsers shipped with published advisories in v0.2.2 because
      # nothing audited the lockfile. Gate on it.
      - name: Audit dependencies
        run: bun audit

      - name: Lint shell scripts
        run: shellcheck install.sh scripts/build-release.sh

  smoke:
    name: Binary smoke test
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        run: bash scripts/build-release.sh --output dist/runit

      - name: Binary reports help and a version
        run: |
          ./dist/runit --help
          version="$(./dist/runit --version)"
          expected="$(node -p 'require("./package.json").version')"
          if [ "${version}" != "${expected}" ]; then
            echo "binary reports '${version}', package.json says '${expected}'" >&2
            exit 1
          fi

      # F04 regression: Bun autoloads .env from the invocation directory into compiled
      # executables. Launching project A from project B must not hand B's environment
      # to A's services. Verified to print [leaked] without the build flags.
      - name: Binary ignores caller-directory dotenv
        run: |
          set -euo pipefail
          bin="${GITHUB_WORKSPACE}/dist/runit"
          root="$(mktemp -d)"
          mkdir -p "${root}/caller" "${root}/project" "${root}/home"
          echo "RUNIT_LEAK_CANARY=leaked" > "${root}/caller/.env"
          cat > "${root}/project/.runit.yml" <<'CONFIG'
          name: canary
          root: .
          default: dev
          actions:
            dev:
              mode: simple
              tasks:
                - name: probe
                  cwd: .
                  cmd: sh -c 'echo CANARY_VALUE=[$RUNIT_LEAK_CANARY]'
          CONFIG
          export HOME="${root}/home"
          (cd "${root}/project" && "${bin}" canary > /dev/null)
          output="$(cd "${root}/caller" && "${bin}" --start canary 2>&1)"
          printf '%s\n' "${output}"
          if printf '%s' "${output}" | grep -q 'CANARY_VALUE=\[leaked\]'; then
            echo "FAIL: caller-directory .env leaked into the launched project" >&2
            exit 1
          fi
          if ! printf '%s' "${output}" | grep -q 'CANARY_VALUE=\[\]'; then
            echo "FAIL: probe did not run; the test proved nothing" >&2
            exit 1
          fi
