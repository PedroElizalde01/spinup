name: CI

on:
  # Every branch, not just main: a branch has to prove itself before it is merged or tagged.
  push:
  pull_request:
  workflow_dispatch:
  # Lets the release workflow reuse this as its gate.
  workflow_call:

# Read-only by default; nothing here publishes.
permissions:
  contents: read

env:
  BUN_VERSION: "1.3.9"

jobs:
  check:
    name: Typecheck, test, audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # The tmux workspace tests drive a real server on a private TMUX_TMPDIR.
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Source and tests: a test that no longer compiles is a regression nobody runs.
      - name: Typecheck
        run: bun run check

      - name: Test
        run: bun test

      # Both YAML parsers shipped with published advisories in v0.2.2 because
      # nothing audited the lockfile. Gate on it.
      - name: Audit dependencies
        run: bun audit

      - name: Lint shell scripts
        run: shellcheck install.sh scripts/*.sh

  native:
    name: Test on ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - name: macos-arm64
            runner: macos-15
            arch: arm64
          - name: macos-x64
            runner: macos-15-intel
            arch: x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # A runner label is a request, not a guarantee; prove the architecture.
      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Install tmux
        run: |
          if command -v brew >/dev/null; then brew install tmux; else sudo apt-get update && sudo apt-get install -y tmux; fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # macOS is case-insensitive and resolves /var through /private, which the
      # migration and ownership code must handle.
      - name: Test
        run: bun test

      - name: Build and smoke the native binary
        run: |
          bash scripts/build-release.sh --output dist/spinup
          bash scripts/smoke.sh dist/spinup "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json)"

  smoke:
    name: Binary smoke test (glibc and musl)
    runs-on: ubuntu-latest
    needs: check

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Smoke the glibc binary
        run: |
          bash scripts/build-release.sh --output dist/spinup
          bash scripts/smoke.sh dist/spinup "$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json)"

      - name: Smoke the musl binary on Alpine
        run: |
          bash scripts/build-release.sh --target bun-linux-x64-musl --output dist/spinup-musl
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json)"
          docker run --rm -v "${PWD}:/work" -w /work alpine:3.20 \
            sh -c "apk add --no-cache bash libstdc++ libgcc >/dev/null && bash scripts/smoke.sh dist/spinup-musl ${version}"

      - name: Man page renders
        run: bun run scripts/build-man.ts | grep -q '^\.TH SPINUP 1'
