name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the publish job needs write access.
permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, audit
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.asset_name }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset_name: runit-linux-x64
            build_target: bun-linux-x64-baseline
          - asset_name: runit-darwin-x64
            build_target: bun-darwin-x64
          - asset_name: runit-darwin-arm64
            build_target: bun-darwin-arm64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build standalone binary
        shell: bash
        run: bash scripts/build-release.sh --target "${{ matrix.build_target }}" --output "dist/${{ matrix.asset_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
