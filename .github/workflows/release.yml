name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Only the publish job needs write access.
permissions:
  contents: read

env:
  BUN_VERSION: "1.3.9"

jobs:
  verify:
    name: Typecheck, test, audit
    uses: ./.github/workflows/ci.yml

  version:
    name: Tag matches package.json
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare
        run: |
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json)"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: spinup-linux-x64
            target: bun-linux-x64-baseline
          - asset: spinup-linux-arm64
            target: bun-linux-arm64
          - asset: spinup-linux-x64-musl
            target: bun-linux-x64-musl
          - asset: spinup-linux-arm64-musl
            target: bun-linux-arm64-musl
          - asset: spinup-darwin-x64
            target: bun-darwin-x64
          - asset: spinup-darwin-arm64
            target: bun-darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bash scripts/build-release.sh --target "${{ matrix.target }}" --output "dist/${{ matrix.asset }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  man:
    name: Build man page
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Render
        run: |
          bun install --frozen-lockfile
          mkdir -p dist
          bun run scripts/build-man.ts > dist/spinup.1

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: spinup.1
          path: dist/spinup.1
          if-no-files-found: error

  # The published files themselves, on the machines they are published for. Cross
  # compiling on Linux proves nothing about whether a macOS or ARM binary starts.
  smoke:
    name: Smoke ${{ matrix.asset }} on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: spinup-linux-x64
            runner: ubuntu-latest
            arch: x86_64
          - asset: spinup-linux-arm64
            runner: ubuntu-24.04-arm
            arch: aarch64
          - asset: spinup-linux-x64-musl
            runner: ubuntu-latest
            arch: x86_64
            alpine: true
          - asset: spinup-linux-arm64-musl
            runner: ubuntu-24.04-arm
            arch: aarch64
            alpine: true
          - asset: spinup-darwin-x64
            runner: macos-15-intel
            arch: x86_64
          - asset: spinup-darwin-arm64
            runner: macos-15
            arch: arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.asset }}
          path: dist

      - name: Verify runner architecture
        run: test "$(uname -m)" = "${{ matrix.arch }}"

      - name: Smoke
        run: |
          chmod +x "dist/${{ matrix.asset }}"
          version="$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' package.json)"
          if [ "${{ matrix.alpine }}" = "true" ]; then
            docker run --rm -v "${PWD}:/work" -w /work alpine:3.20 \
              sh -c "apk add --no-cache bash libstdc++ libgcc >/dev/null && bash scripts/smoke.sh dist/${{ matrix.asset }} ${version}"
          else
            bash scripts/smoke.sh "dist/${{ matrix.asset }}" "${version}"
          fi

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [version, smoke, man]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      # Build provenance is signed with the workflow's OIDC identity.
      id-token: write
      attestations: write

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum spinup-* spinup.1 > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.2.0
        with:
          subject-path: |
            dist/spinup-*
            dist/spinup.1

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS

  homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SHA256SUMS
          path: dist

      # Needs a fine-grained token with contents:write on PedroElizalde01/homebrew-spinup,
      # stored as the HOMEBREW_TAP_TOKEN secret. Without it the release still succeeds.
      - name: Commit the formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${TAP_TOKEN}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN is not set; skipping the Homebrew tap update."
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/PedroElizalde01/homebrew-spinup.git" tap
          mkdir -p tap/Formula
          bash scripts/homebrew-formula.sh "${version}" dist/SHA256SUMS > tap/Formula/spinup.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/spinup.rb
          git commit -m "spinup ${version}" || { echo "formula unchanged"; exit 0; }
          git push
